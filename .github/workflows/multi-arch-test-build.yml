name: Test Build

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.arch }} build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - x86_64
          - aarch64_generic

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGES: zerotier
          # V: s
          V: sc      # 显示 warnings + errors，比较平衡

      - name: Store packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-packages
          path: bin/packages/${{ matrix.arch }}/action/*.apk

      - name: Store logs
        if: always()  # 即使失败也上传日志
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-logs
          path: |
            logs/
            PKG-INFO
            build_dir/target-*/build.log
            build_dir/target-*/root-*/tmp/
