name: Test Build

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.arch }} build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          # - x86_64
          - aarch64_generic

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGES: zerotier
          # V: s
          V: sc      # 显示 warnings + errors，比较平衡
          
      - name: Show Detailed Build Error
        if: failure()
        run: |
          echo "========== LAST 300 LINES OF BUILD LOG =========="
          find . -name "build.log" -o -name "*.log" | head -5 | xargs -I {} sh -c 'echo "=== {} ==="; tail -n 300 {} || true'
          echo "========== END OF LOG =========="
          echo "If above is empty, try this:"
          ls -la logs/ 2>/dev/null || echo "No logs/ directory"

      - name: Store packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-packages
          path: bin/packages/${{ matrix.arch }}/action/*.apk

      - name: Store logs
        if: always()  # 即使失败也上传日志
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-logs
          path: |
            logs/
            PKG-INFO
            build_dir/target-*/build.log
            build_dir/target-*/root-*/tmp/
